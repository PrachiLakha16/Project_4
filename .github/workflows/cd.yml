name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/sre-incident-agent

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # GitOps deploy path: update the Helm values image tag in-repo and let
      # ArgoCD (infrastructure/argocd/application.yaml) reconcile the cluster
      # from the new commit, rather than this workflow talking to the
      # cluster directly.
      - name: Update Helm values image tag
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" infrastructure/helm/sre-incident-agent/values.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/sre-incident-agent/values.yaml
          git diff --cached --quiet || git commit -m "chore(cd): bump image tag to ${{ needs.build-and-push.outputs.image_tag }}"
          git push

      - name: Trigger ArgoCD sync (fallback path)
        if: false
        # Enabled once ARGOCD_SERVER/ARGOCD_AUTH_TOKEN secrets are configured
        # for environments that don't run Argo's auto-sync/self-heal and
        # need an explicit sync triggered from CI instead of image-update
        # detection. Left disabled by default because auto-sync + selfHeal
        # is already true in infrastructure/argocd/application.yaml.
        run: |
          curl -sfL -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_AUTH_TOKEN }}" \
            "${{ secrets.ARGOCD_SERVER }}/api/v1/applications/sre-incident-agent/sync"
