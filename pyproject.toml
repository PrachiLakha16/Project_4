[project]
name = "sre-incident-agent"
version = "0.1.0"
description = "Multi-agent AI SRE incident management platform (LangGraph supervisor + specialist agents)"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "ramcreddy-ch", email = "ramcreddy17@gmail.com" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.1.5",
    "langchain-core>=0.2.20",
    "langgraph-checkpoint-postgres>=1.0.0",
    "psycopg[binary,pool]>=3.1.19",
    "pgvector>=0.2.5",
    "sqlalchemy>=2.0.30",
    "anthropic>=0.30.0",
    "openai>=1.35.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
    "kubernetes>=29.0.0",
    "mcp>=1.0.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "typing-extensions>=4.12.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "pyyaml>=6.0.1",
    "respx>=0.21.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatter, not worth failing CI over.
# B008: FastAPI's Depends()-in-default-argument is the idiomatic DI pattern,
#   not the footgun this rule is designed to catch.
# UP042: str+Enum (not StrEnum) is used deliberately for broader compatibility
#   with pydantic/json serialization behavior we rely on across the codebase.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "evaluation/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
