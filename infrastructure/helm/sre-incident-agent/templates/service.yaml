apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-incident-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-incident-agent.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.port | quote }}
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sre-incident-agent.selectorLabels" . | nindent 4 }}
