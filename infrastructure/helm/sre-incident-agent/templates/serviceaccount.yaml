{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre-incident-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-incident-agent.labels" . | nindent 4 }}
  annotations:
    # IRSA: maps this ServiceAccount to the IAM role created by
    # infrastructure/terraform/modules/iam (least-privilege: Secrets
    # Manager GetSecretValue/DescribeSecret on sre-incident-agent/* only).
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
